plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'

    id 'org.asciidoctor.jvm.convert' version '4.0.2' // rest docs 사용
}

configurations {
    asciidoctorExt // rest docs 사용
}

ext {
    set('snippetsDir', file("build/generated-snippets")) // snippetsDir을 build/generated-snippets 로 설정
}

group = 'com.slc'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-restdocs'
    testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    implementation 'org.springframework.boot:spring-boot-starter-web' // 웹서버 바로 꺼지지 않도록
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa' // 데이터베이스 연결
    runtimeOnly 'com.mysql:mysql-connector-j' // mysql 드라이버

    compileOnly 'org.projectlombok:lombok' // lombok 사용
    annotationProcessor 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    implementation 'io.minio:minio:8.5.9' // minio 사용

    implementation 'org.apache.commons:commons-csv:1.10.0' // csv 파싱

    asciidoctorExt 'org.springframework.restdocs:spring-restdocs-asciidoctor:3.0.3' // rest docs 사용
    testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'
}

tasks.named('testClasses') {
    doFirst {
        delete file('build/docs/asciidoc')
    }
}

tasks.named('test') {
    outputs.dir snippetsDir // rest docs 사용
	useJUnitPlatform()
    finalizedBy asciidoctor
}

tasks.named('asciidoctor') {
    dependsOn test
    configurations 'asciidoctorExt'
    inputs.dir snippetsDir
    finalizedBy copyDocument
    doFirst {
        delete file('src/main/resources/static/docs')
    }
}

tasks.register('copyDocument', Copy) {
    dependsOn asciidoctor
    from file('build/docs/asciidoc')
    into file('src/main/resources/static/docs')
}

bootJar { // rest docs 사용
    dependsOn asciidoctor
    doFirst {
        delete file('static/docs')
    }
    from( "${asciidoctor.outputDir}") {
        into 'static/docs'
    }
}
