async function api(path,options={}){const res=await fetch(path,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(options.headers||{})},...options});if(!res.ok)throw new Error(await res.text()||res.status);if(res.status===204)return null;const type=res.headers.get('content-type')||'';return type.includes('json')?res.json():res.text()}
async function load(){try{const data=await api('/mentor');state.mentors=data.mentorList||[];showToast('백엔드 데이터와 연결되었습니다.')}catch(e){state.mentors=sampleMentors;showToast('데모 데이터로 미리보는 중입니다.')}render();try{$('#remainCount').textContent=await api('/vote/remain');state.loggedIn=true}catch(e){}}

function render(){const list=filtered();$('#resultCount').textContent=list.length;$('#mentorGrid').innerHTML=list.length?list.map((m,i)=>`<article class="mentor-card" style="animation-delay:${i*.055}s"><div class="card-top"><div class="avatar">${m.profileImagePath&&m.profileRelease?`<img src="/files/view/${encodeURIComponent(m.profileImagePath)}" alt="${m.alias||m.name}">`:(m.alias||m.name).slice(0,1)}</div><button class="save ${state.saved.has(m.mentorId)?'active':''}" data-save="${m.mentorId}" aria-label="관심 등록">${state.saved.has(m.mentorId)?'♥':'♡'}</button><span class="index-no">CS—${String(i+1).padStart(2,'0')}</span></div><div class="card-body"><div class="card-title"><h3>${m.alias||m.name}</h3><span>${(m.major||[]).map(val).join(' · ')}</span></div><p class="role">${m.companyName||'Independent'} · ${m.job||'Mentor'}</p><div class="tags">${[...(m.field||[]).map(val),m.careerPath].filter(Boolean).slice(0,3).map(x=>`<span class="tag"># ${x}</span>`).join('')}</div><div class="card-foot"><span class="status">멘토링 가능</span><button class="detail" data-detail="${m.mentorId}">프로필 보기 →</button></div></div></article>`).join(''):'<div class="empty">조건에 맞는 멘토를 찾지 못했어요.<br>다른 키워드로 탐색해 보세요.</div>'}

function openDetail(id){const m=mentor(id);if(!m)return;$('#detailContent').innerHTML=`<div class="eyebrow">Mentor profile</div><h2>${m.alias||m.name}</h2><p class="role">${m.companyName||''} · ${m.job||''}</p><div class="tags">${[...(m.major||[]).map(val),...(m.field||[]).map(val)].map(x=>`<span class="tag"># ${x}</span>`).join('')}</div><p class="intro">${m.introduce||'멘토의 경험과 커리어 이야기를 만나보세요.'}</p><div class="dialog-actions"><button class="primary" data-vote="${m.mentorId}">${state.voted.has(m.mentorId)?'시그널 보냄 ✓':'이 멘토에게 시그널 보내기'}</button>${m.linkedin?`<a class="secondary" href="${m.linkedin}" target="_blank" rel="noreferrer">LinkedIn</a>`:''}</div>`;$('#detailModal').classList.add('open')}
async function save(id){if(!state.loggedIn){$('#loginModal').classList.add('open');return}try{await api('/favorite',{method:'POST',body:JSON.stringify({mentorId:Number(id)})});state.saved.add(Number(id));showToast('관심 멘토로 저장했어요.')}catch(e){state.saved.has(Number(id))?state.saved.delete(Number(id)):state.saved.add(Number(id));showToast('데모에서 관심 멘토로 저장했어요.')}render()}
async function vote(id){if(!state.loggedIn){$('#detailModal').classList.remove('open');$('#loginModal').classList.add('open');return}try{await api('/vote',{method:'POST',body:JSON.stringify({mentorId:Number(id)})});state.voted.add(Number(id));const n=Number($('#remainCount').textContent);$('#remainCount').textContent=Math.max(0,n-1);showToast('시그널을 보냈습니다.')}catch(e){showToast('시그널을 보내지 못했어요. 다시 확인해 주세요.')}openDetail(id)}
function showToast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>t.classList.remove('show'),2600)}
$('#searchInput').addEventListener('input',e=>{state.query=e.target.value;render()});
$('#filters').addEventListener('click',e=>{const b=e.target.closest('[data-filter]');if(!b)return;state.filter=b.dataset.filter;$$('.chip').forEach(x=>x.classList.toggle('active',x===b));render()});

$('#loginOpen').onclick=()=>$('#loginModal').classList.add('open');
$('#loginForm').addEventListener('submit',async e=>{e.preventDefault();const fd=new FormData(e.target);try{await api('/login',{method:'POST',body:JSON.stringify(Object.fromEntries(fd))});state.loggedIn=true;$('#loginModal').classList.remove('open');$('#loginOpen').textContent='로그인됨';showToast('반가워요. 로그인되었습니다.');try{$('#remainCount').textContent=await api('/vote/remain')}catch(_){}}catch(err){showToast('학번 또는 패스코드를 확인해 주세요.')}});
$$('[data-featured]').forEach(b=>b.onclick=()=>{const m=state.mentors[Number(b.dataset.featured)];if(m)openDetail(m.mentorId)});
$('#heroExplore').onclick=()=>document.querySelector('main').scrollIntoView({behavior:'smooth'});
$$('[data-theme]').forEach(button=>button.onclick=()=>{
  const theme=button.dataset.theme;

  $$('[data-theme]').forEach(item=>item.classList.toggle('active',item===button));

});
const preferredDemo=localStorage.getItem('career-signal-demo');
if(preferredDemo)$(`[data-theme="${preferredDemo}"]`)?.click();
load();

<script>
const $=selector=>document.querySelector(selector);
const $$=selector=>document.querySelectorAll(selector);
const state={mentors:[],visible:[],votes:[],voted:new Set(),saved:new Set(),filters:{majors:new Set(),careers:new Set(),fields:new Set(),foreign:new Set()},showSavedOnly:false,query:'',user:null,isAdmin:false,remain:3};
const fieldLabels={SEMICONDUCTOR:'반도체',DISPLAY:'디스플레이',AI:'AI',SW:'SW',ELECTRONICS:'전자',MACHINERY:'기계',AUTOMOTIVE:'자동차',BIOTECHNOLOGY:'바이오',CHEMICALS:'화학',ENERGY:'에너지',FINANCE:'금융',CONSULTING:'컨설팅',MARKETING:'마케팅',EDUCATION:'교육',LEGAL_SERVICE:'법률',HEALTHCARE:'의료',PUBLIC_INSTITUTION:'공공기관',RESEARCH_INSTITUTION:'연구기관',STARTUP:'스타트업',ETC:'기타'};
const careerLabels={COMPANY:'기업 재직',MASTER:'대학원 재학',RESEARCH:'연구',PUBLIC:'공공기관',CEO:'창업',FREELANCER:'프리랜서',PREPARING:'준비 중',ETC:'기타'};

const majorGroups={
 '경영·경제·통상':['경영학과','경제학과','글로벌경영학과','글로벌경제학과','국제통상학연계전공','Kelley Business School','소비자학과'],
 '정치·행정·법·사회':['정치외교학과','행정학과','법학과','공익과법연계전공','사회복지학과','심리학과','아동청소년학과','글로벌리더학부'],
 '인문·언어·역사·철학':['국어국문학과','영어영문학과','독어독문학과','중어중문학과','프랑스어문학과','사학과','철학과','유학동양학과','문헌정보학과','한문교육과'],
 '미디어·문화·디자인':['미디어커뮤니케이션학과','영상학과','디자인학과','컬처앤테크놀로지융합전공'],

 '공학·반도체·산업':['기계공학부','시스템경영공학과','전자전기공학부','반도체시스템공학과','신소재공학부','화학공학부','에너지과학과연계전공'],

 '스포츠':['스포츠과학과'],'자유·융합':['자기설계융합전공']};
const filterChoices={careers:careerLabels,fields:fieldLabels,foreign:{true:'해외 경험 유',false:'해외 경험 무'}};
function escapeHtml(value=''){return String(value).replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]))}
function majorName(value){return typeof value==='object'&&value?value.name:String(value||'')}
function errorMessage(error){if(error?.code==='TOO_MANY_VOTE'||error?.status===429)return '사용 가능한 시그널을 모두 보냈습니다.';if(error?.code==='ALREADY_EXISTS_VOTE'||error?.status===409)return '이미 시그널을 보낸 멘토입니다.';if(error?.code==='NOT_MATCHED_PASSCODE'||error?.status===401)return '학번 또는 패스코드를 확인해 주세요.';if(error?.code==='NOT_FOUND_USER_ID'||error?.status===404)return '등록되지 않은 학번입니다.';const message=error?.message||'';if(/internal server error/i.test(message))return '서버에서 요청을 처리하지 못했습니다. 잠시 후 다시 시도해 주세요.';return message||'요청을 처리하지 못했습니다.'}
async function api(path,options={}){const config={credentials:'same-origin',...options,headers:{...(options.body instanceof FormData?{}:{'Content-Type':'application/json'}),...(options.headers||{})}};const response=await fetch(path,config),type=response.headers.get('content-type')||'',raw=response.status===204?'':await response.text();if(!response.ok){let payload={};try{payload=JSON.parse(raw)}catch(_){payload={message:raw}}const error=new Error(payload.message||payload.error||`HTTP ${response.status}`);error.status=response.status;error.code=payload.code;throw error}if(response.status===204||!raw)return null;return type.includes('json')?JSON.parse(raw):raw}
function showToast(message){const toast=$('#toast');toast.textContent=message;toast.classList.add('show');clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>toast.classList.remove('show'),2800)}
function setSessionUI(){const loggedIn=Boolean(state.user);$('#loginOpen').hidden=loggedIn;$('#logoutBtn').hidden=!loggedIn;$('#adminOpen').hidden=!state.isAdmin}
function voteMentorId(vote){return Number(vote?.mentorId??vote?.mentor?.mentorId??0)}
function isFinalVote(vote){return Boolean(vote?.final??vote?.isFinal)}
function rebuildVoteSets(){state.voted=new Set(state.votes.filter(isFinalVote).map(voteMentorId).filter(Boolean));state.saved=new Set(state.votes.filter(v=>!isFinalVote(v)).map(voteMentorId).filter(Boolean))}
function renderOrbits(){const count=Math.max(0,Math.min(3,3-Number(state.remain)));const votedMentors=[...state.voted].map(id=>state.mentors.find(m=>m.mentorId===id)).filter(Boolean);const people=Array.from({length:count},(_,index)=>{const mentor=votedMentors[index];return `<div class="hero-choice"><button class="profile-orbit" ${mentor?`data-detail="${mentor.mentorId}"`:''} aria-label="${mentor?escapeHtml(mentor.alias||mentor.name):`투표한 멘토 ${index+1}`} 봐보기"><img src="${mentor?.profileImagePath&&mentor.profileRelease?`/files/view/${encodeURIComponent(mentor.profileImagePath)}`:'/assets/profile-placeholder.png'}" alt=""></button>${mentor?`<button class="remove-vote" data-cancel="${mentor.mentorId}">취소</button>`:''}</div>`}).join('');const add=count<3?'<button class="profile-orbit add" data-explore aria-label="멘토 찾아보기"><img src="/assets/add-profile.png" alt=""></button>':'';$('#voteOrbits').innerHTML=people+add;$('#remainCount').textContent=state.remain}
function intersects(selected,values){return !selected.size||values.some(value=>selected.has(String(value)))}
function filteredMentors(){if(state.showSavedOnly)return state.visible.filter(m=>state.saved.has(Number(m.mentorId)));const query=state.query.trim().toLowerCase();return state.visible.filter(m=>{const majors=(m.major||[]).map(majorName),fields=m.field||[];return [m.alias||m.name,m.name,m.companyName,m.job,...majors,...fields.map(f=>fieldLabels[f]||f)].join(' ').toLowerCase().includes(query)&&intersects(state.filters.majors,majors)&&intersects(state.filters.fields,fields)&&intersects(state.filters.careers,[m.careerPath])&&intersects(state.filters.foreign,[String(Boolean(m.foreignSchool))])})}
async function mentorVoteCount(id){try{return await api(`/vote/mentor/${id}`)}catch(_){return null}}
function renderSaved(){const button=$('#savedFilter');$('#savedCount').textContent=state.saved.size;button.classList.toggle('active',state.showSavedOnly);button.setAttribute('aria-pressed',String(state.showSavedOnly));button.title=state.user?`찜한 멘토 ${state.saved.size}명 보기`:'로그인 후 사용할 수 있습니다.'}
function renderMentors(){const list=filteredMentors();$('#resultCount').textContent=list.length;$('#mentorGrid').innerHTML=list.length?list.map((m,index)=>`<article class="mentor-card" style="animation-delay:${index*.04}s"><div class="card-top"><button class="save ${state.saved.has(m.mentorId)||state.voted.has(m.mentorId)?'active':''}" data-save="${m.mentorId}" aria-label="${state.saved.has(m.mentorId)?'관심 멘토에서 삭제':'관심 멘토로 저장'}" aria-pressed="${state.saved.has(m.mentorId)}">${state.saved.has(m.mentorId)||state.voted.has(m.mentorId)?'♥':'♡'}</button></div><div class="card-body"><div class="card-title"><h3>${escapeHtml(m.alias||m.name)}</h3><span>${(m.major||[]).map(majorName).map(escapeHtml).join(' · ')}</span></div><p class="role">${escapeHtml(m.companyName||'소속 미등록')} · ${escapeHtml(m.job||'직무 미등록')}</p><div class="tags">${[...(m.field||[]).map(f=>fieldLabels[f]||f),careerLabels[m.careerPath]||m.careerPath].filter(Boolean).slice(0,5).map(tag=>`<span class="tag"># ${escapeHtml(tag)}</span>`).join('')}</div><div class="card-foot"><span class="status">${escapeHtml(m.mentorStatus||'멘토')}</span><button class="detail" data-detail="${m.mentorId}">프로필 자세히 보기 →</button></div></div></article>`).join(''):`<div class="empty">${state.showSavedOnly?'아직 찜한 멘토가 없습니다.':'선택한 필터의 교집합에 해당하는 멘토가 없습니다.'}</div>`;renderSaved()}
async function loadMentors(){try{$('#mentorGrid').innerHTML='<div class="loading">멘토 정보를 불러오는 중입니다.</div>';const data=await api('/mentor');state.visible=data.mentorList||[];state.mentors=state.visible;renderMentors()}catch(error){$('#mentorGrid').innerHTML=`<div class="error-panel">멘토 정보를 불러오지 못했습니다.<br><small>${escapeHtml(errorMessage(error))}</small><br><button class="secondary" data-retry>다시 시도</button></div>`}}
async function refreshVotes(){if(!state.user){state.votes=[];state.voted.clear();state.saved.clear();state.showSavedOnly=false;state.remain=3;renderOrbits();renderMentors();return}try{state.remain=Number(await api('/vote/remain'))}catch(error){showToast('잔여 투표권을 불러오지 못했습니다.')}try{const voteData=await api('/vote');state.votes=voteData.votes||[];rebuildVoteSets()}catch(error){state.votes=[];state.voted.clear();state.saved.clear()}renderOrbits();renderMentors()}
async function detectSession(){try{const remain=await api('/vote/remain');state.user={};state.remain=Number(remain);try{await api('/admin/check');state.isAdmin=true}catch(_){state.isAdmin=false};setSessionUI();await refreshVotes()}catch(_){state.user=null;state.isAdmin=false;setSessionUI();renderOrbits()}}
function mentorById(id){return state.mentors.find(m=>m.mentorId===Number(id))||state.visible.find(m=>m.mentorId===Number(id))}
async function openDetail(id){const mentor=mentorById(id);if(!mentor)return;const count=state.isAdmin&&mentor.voteRelease?await mentorVoteCount(id):null,voted=state.voted.has(Number(id)),photo=mentor.profileImagePath&&mentor.profileRelease?`background-image:url('/files/view/${encodeURIComponent(mentor.profileImagePath)}')`:'',mentorMessage=mentor.mentorComment||mentor.oneLine||mentor.message||'';const tags=[['전공',(mentor.major||[]).map(majorName).join(' · ')],['직장명',mentor.companyName],['직무',mentor.job],['전문 분야',(mentor.field||[]).map(f=>fieldLabels[f]||f).join(' · ')],['직업 유형',careerLabels[mentor.careerPath]||mentor.careerPath],['근무지 유형',areaLabels[mentor.area]||'미등록']];$('#detailContent').innerHTML=`<div class="business-card"><div class="profile-photo" style="${photo}">${photo?'':'프로필 이미지 영역'}</div><div class="profile-info"><div class="eyebrow">Mentor profile</div><h2>${escapeHtml(mentor.alias||mentor.name)}</h2><div class="labeled-tags">${tags.filter(([,v])=>v).map(([label,value])=>`<span class="labeled-tag"><b>${label}</b># ${escapeHtml(value)}</span>`).join('')}</div><div class="profile-sections"><section class="profile-section quote"><h3>멘토의 한 마디</h3><p>${escapeHtml(mentorMessage||'등록된 한 마디가 없습니다.')}</p></section><section class="profile-section bio"><h3>약력</h3><p>${escapeHtml(mentor.introduce||'등록된 약력이 없습니다.')}</p></section></div>${mentor.limitRelease?`<p>멘토링 정원 <b>${mentor.mentorLimit}</b>명</p>`:''}${count!==null?`<p>현재 받은 시그널 <b>${count}</b>개</p>`:''}<div class="dialog-actions"><button class="primary" data-vote="${mentor.mentorId}">${voted?'시그널 취소':'이 멘토에게 시그널 보내기'}</button>${mentor.linkedin?`<a class="secondary" href="${escapeHtml(mentor.linkedin)}" target="_blank" rel="noreferrer">LinkedIn</a>`:''}</div></div></div>`;$('#detailModal').classList.add('open')}
function requireLogin(){if(state.user)return true;$('#loginModal').classList.add('open');showToast('로그인이 필요한 기능입니다.');return false}
async function toggleFavorite(id){if(!requireLogin())return;const mentorId=Number(id);try{if(state.saved.has(mentorId)||state.voted.has(mentorId)){await api(`/vote/${mentorId}`,{method:'DELETE'});showToast('관심·투표 내역에서 삭제했습니다.')}else{await api('/favorite',{method:'POST',body:JSON.stringify({mentorId})});showToast('관심 멘토로 저장했습니다.')}await refreshVotes()}catch(error){showToast(errorMessage(error))}}
async function toggleVote(id){if(!requireLogin())return;const mentorId=Number(id),isCancel=state.voted.has(mentorId);if(!isCancel&&Number(state.remain)<=0){showToast('사용 가능한 시그널을 모두 보냈습니다.');return}try{if(isCancel){await api(`/vote/${mentorId}`,{method:'DELETE'});showToast('시그널을 취소했습니다.')}else{await api('/vote',{method:'POST',body:JSON.stringify({mentorId})});showToast('시그널을 보냈습니다.')}await refreshVotes();openDetail(mentorId)}catch(error){if(!isCancel&&/internal server error/i.test(error.message||'')){showToast(Number(state.remain)<=0?'사용 가능한 시그널을 모두 보냈습니다.':'이미 처리된 시그널이거나 서버에서 요청을 완료하지 못했습니다.')}else showToast(errorMessage(error))}}
async function login(event){event.preventDefault();const loginForm=event.currentTarget,formData=new FormData(loginForm);try{state.user=await api('/login',{method:'POST',body:JSON.stringify(Object.fromEntries(formData))});try{await api('/admin/check');state.isAdmin=true}catch(_){state.isAdmin=false};setSessionUI();$('#loginModal').classList.remove('open');loginForm.reset();await refreshVotes();showToast('로그인되었습니다.')}catch(error){showToast(errorMessage(error))}}
async function logout(){try{await api('/logout',{method:'POST'});state.user=null;state.isAdmin=false;setSessionUI();await refreshVotes();showToast('로그아웃되었습니다.')}catch(error){showToast(errorMessage(error))}}
function mentorPayload(form){const data=new FormData(form);const checked=name=>form.elements[name].checked;return{name:data.get('name'),alias:data.get('alias')||data.get('name'),major:data.get('major').split(',').map(v=>v.trim()).filter(Boolean),field:data.get('field').split(',').map(v=>v.trim()).filter(Boolean),companyName:data.get('companyName'),job:data.get('job'),careerPath:data.get('careerPath'),areaName:data.get('areaName'),area:data.get('area'),foreignSchool:checked('foreignSchool'),majorRelated:checked('majorRelated'),graduatedYear:data.get('graduatedYear')?Number(data.get('graduatedYear')):null,introduce:data.get('introduce'),linkedin:data.get('linkedin'),profileImagePath:data.get('profileImagePath')||null,profileRelease:checked('profileRelease'),voteRelease:checked('voteRelease'),mentorStatus:data.get('mentorStatus'),mentorLimit:Number(data.get('mentorLimit')||5),limitRelease:checked('limitRelease'),remainRelease:checked('remainRelease'),oneLine:data.get('oneLine')||null}}
function fillMentorForm(id){const m=mentorById(id),form=$('#mentorForm');if(!m)return;Object.entries({mentorId:m.mentorId,name:m.name,alias:m.alias,major:(m.major||[]).map(majorName).join(','),field:(m.field||[]).join(','),companyName:m.companyName,job:m.job,careerPath:m.careerPath,areaName:m.areaName,area:m.area,graduatedYear:m.graduatedYear,linkedin:m.linkedin,mentorLimit:m.mentorLimit,mentorStatus:m.mentorStatus,profileImagePath:m.profileImagePath,oneLine:m.oneLine,introduce:m.introduce}).forEach(([name,value])=>{if(form.elements[name])form.elements[name].value=value??''});['foreignSchool','majorRelated','profileRelease','voteRelease','limitRelease','remainRelease'].forEach(name=>form.elements[name].checked=Boolean(m[name]));form.scrollIntoView({behavior:'smooth'})}
async function loadAdmin(){if(!state.isAdmin)return;const [mentorData,userData]=await Promise.all([api('/mentor'),api('/admin/user')]);state.mentors=mentorData.mentorList||[];$('#adminMentorRows').innerHTML=state.mentors.map(m=>`<tr><td>${m.mentorId}</td><td>${escapeHtml(m.name)}</td><td>${escapeHtml(m.companyName||'')} · ${escapeHtml(m.job||'')}</td><td><button data-edit-mentor="${m.mentorId}">수정</button> <button class="danger" data-delete-mentor="${m.mentorId}">삭제</button></td></tr>`).join('');const users=userData.user_list||[];$('#adminUserRows').innerHTML=users.map(u=>`<tr><td>${u.userId}</td><td>${escapeHtml(u.studentId)}</td><td><button class="danger" data-delete-user="${u.userId}">삭제</button></td></tr>`).join('')}
async function saveMentor(event){event.preventDefault();const id=event.currentTarget.elements.mentorId.value;try{await api(id?`/admin/mentor/${id}`:'/admin/mentor',{method:id?'PATCH':'POST',body:JSON.stringify(mentorPayload(event.currentTarget))});event.currentTarget.reset();event.currentTarget.elements.mentorId.value='';showToast(id?'멘토 정보를 수정했습니다.':'멘토를 등록했습니다.');await Promise.all([loadAdmin(),loadMentors()])}catch(error){showToast(errorMessage(error))}}
async function uploadForm(event,path){event.preventDefault();try{const result=await api(path,{method:'POST',body:new FormData(event.currentTarget)});showToast(typeof result==='string'?result:'업로드가 완료되었습니다.');event.currentTarget.reset();await Promise.all([loadAdmin(),loadMentors()])}catch(error){showToast(errorMessage(error))}}
async function addUser(event){event.preventDefault();try{await api('/admin/user',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(event.currentTarget)))});event.currentTarget.reset();showToast('사용자를 등록했습니다.');await loadAdmin()}catch(error){showToast(errorMessage(error))}}
function optionMarkup(group,value,label){return `<label class="filter-option"><input type="checkbox" data-filter-group="${group}" value="${escapeHtml(value)}"><span>${escapeHtml(label)}</span></label>`}
function renderStructuredFilters(){const majors=Object.entries(majorGroups).map(([category,items])=>`<div class="major-category"><h3>${escapeHtml(category)}</h3><label class="category-toggle"><input type="checkbox" data-major-category="${escapeHtml(category)}"><span>분류 전체 선택</span></label><div class="filter-options">${items.map(item=>optionMarkup('majors',item,item)).join('')}</div></div>`).join('');const groups=[['careers','직업 유형'],['fields','전문 분야'],['foreign','해외 경험']].map(([key,title])=>`<details class="filter-group"><summary>${title}</summary><div class="filter-options">${Object.entries(filterChoices[key]).map(([value,label])=>optionMarkup(key,value,label)).join('')}</div></details>`).join('');$('#structuredFilters').innerHTML=`<details class="filter-group"><summary>전공</summary><div class="filter-options">${majors}</div></details>${groups}`}
function resetFilters(){Object.values(state.filters).forEach(set=>set.clear());state.showSavedOnly=false;$$('#structuredFilters input').forEach(input=>input.checked=false);renderMentors()}
document.addEventListener('click',async event=>{const detail=event.target.closest('[data-detail]'),save=event.target.closest('[data-save]'),vote=event.target.closest('[data-vote]'),cancel=event.target.closest('[data-cancel]'),explore=event.target.closest('[data-explore]'),retry=event.target.closest('[data-retry]'),edit=event.target.closest('[data-edit-mentor]'),deleteMentor=event.target.closest('[data-delete-mentor]'),deleteUser=event.target.closest('[data-delete-user]');if(detail)openDetail(detail.dataset.detail);if(save)toggleFavorite(save.dataset.save);if(vote)toggleVote(vote.dataset.vote);if(cancel)toggleVote(cancel.dataset.cancel);if(explore)$('main').scrollIntoView({behavior:'smooth'});if(retry)loadMentors();if(edit)fillMentorForm(edit.dataset.editMentor);if(deleteMentor&&confirm('이 멘토를 삭제할까요?')){try{await api(`/admin/mentor/${deleteMentor.dataset.deleteMentor}`,{method:'DELETE'});await Promise.all([loadAdmin(),loadMentors()])}catch(error){showToast(errorMessage(error))}}if(deleteUser&&confirm('이 사용자를 삭제할까요?')){try{await api(`/admin/user/${deleteUser.dataset.deleteUser}`,{method:'DELETE'});await loadAdmin()}catch(error){showToast(errorMessage(error))}}});
$('#searchInput').addEventListener('input',event=>{state.query=event.target.value;renderMentors()});
$('#structuredFilters').addEventListener('change',event=>{const input=event.target;if(input.matches('[data-filter-group]')){const set=state.filters[input.dataset.filterGroup];input.checked?set.add(input.value):set.delete(input.value)}if(input.matches('[data-major-category]')){majorGroups[input.dataset.majorCategory].forEach(major=>{const checkbox=[...$$('[data-filter-group="majors"]')].find(item=>item.value===major);if(checkbox){checkbox.checked=input.checked;input.checked?state.filters.majors.add(major):state.filters.majors.delete(major)}})}renderMentors()});
$('#structuredFilters').addEventListener('toggle',event=>{if(!event.target.matches('.filter-group')||!event.target.open)return;$$('#structuredFilters .filter-group').forEach(group=>{if(group!==event.target)group.open=false})},true);
$('#savedFilter').addEventListener('click',()=>{if(!requireLogin())return;state.showSavedOnly=!state.showSavedOnly;renderMentors()});
$('#filterReset').addEventListener('click',resetFilters);
$('#loginForm').addEventListener('submit',login);$('#logoutBtn').addEventListener('click',logout);$('#loginOpen').addEventListener('click',()=>$('#loginModal').classList.add('open'));$('#adminOpen').addEventListener('click',async()=>{$('#adminModal').classList.add('open');try{await loadAdmin()}catch(error){showToast(errorMessage(error))}});$('#mentorForm').addEventListener('submit',saveMentor);$('#mentorCsvForm').addEventListener('submit',event=>uploadForm(event,'/admin/mentor/batch'));$('#userCsvForm').addEventListener('submit',event=>uploadForm(event,'/admin/user/batch'));$('#fileUploadForm').addEventListener('submit',event=>uploadForm(event,'/files/upload'));$('#userForm').addEventListener('submit',addUser);
$$('[data-admin-tab]').forEach(button=>button.addEventListener('click',()=>{$$('[data-admin-tab]').forEach(item=>item.classList.toggle('active',item===button));$$('.admin-pane').forEach(pane=>pane.classList.toggle('active',pane.id===`admin${button.dataset.adminTab[0].toUpperCase()+button.dataset.adminTab.slice(1)}`))}));
$$('[data-close]').forEach(button=>button.addEventListener('click',()=>button.closest('.modal').classList.remove('open')));$$('.modal').forEach(modal=>modal.addEventListener('click',event=>{if(event.target===modal)modal.classList.remove('open')}));document.addEventListener('keydown',event=>{if(event.key==='Escape')$$('.modal.open').forEach(modal=>modal.classList.remove('open'))});
async function initialize(){renderStructuredFilters();renderOrbits();await loadMentors();await detectSession()}
initialize();
</script>
</body>
</html>
